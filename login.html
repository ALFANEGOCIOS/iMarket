
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iniciar sesión | iMarket Cuba</title>

  <meta
    name="description"
    content="Inicia sesión en tu cuenta de iMarket Cuba."
  >

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body class="auth-page">

  <!-- HEADER -->
  <header class="site-header auth-header">
    <div class="header-inner">

      <a href="index.html" class="brand">
        <span class="brand-icon">i</span>
        <span class="brand-text">Market Cuba</span>
      </a>

      <a href="index.html" class="back-home">
        ← Volver al inicio
      </a>

    </div>
  </header>


  <!-- MAIN -->
  <main class="login-main">

    <div class="login-container">

      <!-- LOGIN CARD -->
      <section class="login-card">

        <div class="login-header">

          <div class="login-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
              <path d="M10 17l5-5-5-5" />
              <path d="M15 12H3" />
            </svg>
          </div>

          <span class="eyebrow">Tu cuenta</span>

          <h1>Bienvenido de nuevo.</h1>

          <p>
            Inicia sesión para administrar tus publicaciones,
            favoritos y conversaciones.
          </p>

        </div>


        <!-- FORM -->
        <form id="loginForm" class="login-form">

          <div
            id="loginError"
            class="form-alert error"
            role="alert"
            aria-live="polite"
            hidden
          ></div>

          <div
            id="loginSuccess"
            class="form-alert success"
            role="status"
            aria-live="polite"
            hidden
          ></div>


          <!-- EMAIL -->
          <div class="form-group">

            <label for="email">
              Correo electrónico
            </label>

            <div class="input-wrapper">

              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="M3 7l9 6 9-6" />
              </svg>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="tu@email.com"
                autocomplete="email"
                required
              >

            </div>

          </div>


          <!-- PASSWORD -->
          <div class="form-group">

            <div class="label-row">

              <label for="password">
                Contraseña
              </label>

              <a href="#" id="forgotPassword">
                ¿Olvidaste tu contraseña?
              </a>

            </div>

            <div class="input-wrapper">

              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="10" width="16" height="11" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Tu contraseña"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="passwordToggle"
                aria-label="Mostrar contraseña"
              >
                <svg
                  class="eye-open"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" />
                  <circle cx="12" cy="12" r="2.5" />
                </svg>

                <svg
                  class="eye-closed"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path d="M3 3l18 18" />
                  <path d="M10.6 6.2A10.5 10.5 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.1 3.7" />
                  <path d="M6.2 6.2C3.5 8.2 2 12 2 12s3.5 6 10 6a10.6 10.6 0 0 0 3.5-.6" />
                </svg>
              </button>

            </div>

          </div>


          <!-- REMEMBER -->
          <label class="remember-row">

            <input
              type="checkbox"
              id="remember"
              name="remember"
            >

            <span class="custom-checkbox"></span>

            <span>
              Mantener sesión iniciada
            </span>

          </label>


          <!-- SUBMIT -->
          <button
            type="submit"
            class="login-submit"
            id="loginSubmit"
          >
            <span class="button-text">
              Iniciar sesión
            </span>

            <span class="button-loader" aria-hidden="true"></span>
          </button>

        </form>


        <!-- DIVIDER -->
        <div class="auth-divider">
          <span>o</span>
        </div>


        <!-- REGISTER -->
        <div class="register-prompt">

          <span>
            ¿Todavía no tienes una cuenta?
          </span>

          <a href="registro.html">
            Crear cuenta
          </a>

        </div>

      </section>


      <!-- SECURITY MESSAGE -->
      <div class="login-security">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l7 3v5c0 4.5-3 8.7-7 10-4-1.3-7-5.5-7-10V6l7-3z" />
          <path d="M9 12l2 2 4-4" />
        </svg>

        <span>
          Tu información se maneja de forma segura.
        </span>

      </div>

    </div>

  </main>


  <!-- FOOTER -->
  <footer class="auth-footer">

    <div class="auth-footer-inner">

      <span>
        © 2026 iMarket Cuba
      </span>

      <span>
        By
        <a
          href="https://alfanegocios.github.io/"
          target="_blank"
          rel="noopener"
        >
          ALFA NEGOCIOS
        </a>
      </span>

    </div>

  </footer>
<script type="module" src="js/bootstrap.js"></script>

</body>
</html>
